<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#4f46e5" />
    <meta
      name="description"
      content="Biblioteca Digital — catálogo, leitura, comunidade e loja de livros."
    />
    <link rel="icon" href="assets/icon.svg" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/ultimate.css" />
    <link id="themeCSS" rel="stylesheet" href="css/moderno.css" />
    <link rel="stylesheet" href="css/design.css" />
    <title>Biblioteca Digital</title>
  </head>
  <body>
    <div id="loader" class="loader" role="status" aria-live="polite" aria-label="Carregando Biblioteca Digital">
      <div class="loader-card">
        <img class="loader-logo" src="assets/logo.svg" alt="" />
        <span class="loader-kicker">BIBLIOTECA DIGITAL</span>
        <h1>Um instante</h1>
        <p>Estamos preparando sua biblioteca.</p>
        <div class="loader-line" aria-hidden="true"><i></i></div>
      </div>
    </div>
    <div id="auth" class="auth-screen hidden"></div>
    <div id="appShell" class="app-shell hidden">
      <aside class="sidebar" id="sidebar">
        <div class="brand">
          <img src="assets/logo.svg" alt="Biblioteca Digital" />
          <div><b>Biblioteca</b><small>Digital</small></div>
        </div>
        <div id="sideUser" class="side-user"></div>
        <nav>
          <label>Biblioteca</label>
          <button class="nav active" data-page="home">
            ⌂ <span>Início</span>
          </button>
          <button class="nav" data-page="catalogo">
            ▦ <span>Catálogo</span>
          </button>
          <button class="nav" data-page="descobrir">
            ✦ <span>Descobrir</span>
          </button>
          <button class="nav" data-page="minha">
            ♡ <span>Minha biblioteca</span>
          </button>
          <button class="nav" data-page="pedidos">
            ▤ <span>Meus pedidos</span>
          </button>
          <button class="nav" data-page="comunidade">
            ◉ <span>Comunidade</span>
          </button>
          <label>Conta</label>
          <button class="nav" data-page="perfil">
            ◯ <span>Meu perfil</span>
          </button>
          <button class="nav" data-page="config">
             <span>Configurações</span>
          </button>
          <button class="nav admin-only" data-page="admin">
            ▣ <span>Administração</span>
          </button>
        </nav>
        <div class="side-bottom">
          <div><i></i> Sistema local</div>
          <small>Dados salvos neste navegador</small
          ><button id="logoutBtn" class="logout">Sair da conta</button>
        </div>
      </aside>
      <div class="overlay" id="overlay"></div>
      <section class="workspace">
        <header class="topbar">
          <div class="top-left">
            <button id="menuBtn" class="icon mobile">☰</button>
            <div class="crumb" id="crumb">Biblioteca / <b>Início</b></div>
          </div>
          <button id="searchBtn" class="global-search">
            ⌕ <span>Pesquisar livros, autores ou gêneros...</span><kbd>/</kbd>
          </button>
          <div class="actions">
            <button id="notifyBtn" class="icon">♢<i id="notifyDot"></i></button
            ><button id="cartBtn" class="cart">
               Carrinho <b id="cartCount">0</b></button
            ><button id="modeBtn" class="icon">☾</button
            ><button id="profileTop" class="profile-top">
              <span id="avatar">U</span
              ><span><b id="topName">Usuário</b><small>Conta</small></span>
            </button>
          </div>
        </header>
        <main id="content"></main>
        <footer class="site-footer">
          <div class="footer-bottom">
            <span>Biblioteca Digital 2026</span>
          </div>
        </footer>
      </section>
    </div>
    <div id="modal" class="modal hidden">
      <div class="modal-box">
        <button class="modal-close" id="modalClose">×</button>
        <div id="modalContent"></div>
      </div>
    </div>
    <div id="toast" class="toast"></div>
    <div id="palette" class="modal hidden">
      <div class="palette-box">
        <div class="palette-head">
          <b>Comandos rápidos</b><button id="paletteClose">Esc</button>
        </div>
        <input id="paletteInput" placeholder="Digite uma ação..." />
        <div id="paletteItems"></div>
      </div>
    </div>
    <script src="js/livros.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/core.js"></script>
    <script src="js/app.js"></script>
    <script src="js/admin.js"></script>
    <script src="js/enhancements.js"></script>
    <script src="js/ultimate.js"></script>
    <script src="js/melhorias.js"></script>
  </body>
</html>
